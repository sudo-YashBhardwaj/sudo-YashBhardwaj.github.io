<text x="705.0" y="450.0" font-size="19" fill="#0b0b0b" font-weight="700" text-anchor="start">What we found</text>
<circle cx="709" cy="483" r="3.5" fill="#52514e"/>
<text x="721.0" y="488.0" font-size="15.5" fill="#0b0b0b" font-weight="700" text-anchor="start">Branches are cheap</text>
<text x="721.0" y="509.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start">43-62% fewer decisions per success than restarts</text>
<circle cx="709" cy="535" r="3.5" fill="#52514e"/>
<text x="721.0" y="540.0" font-size="15.5" fill="#0b0b0b" font-weight="700" text-anchor="start">but they lose contrast</text>
<text x="721.0" y="561.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start">54-67% of branch groups have identical returns (restarts 8-17%)</text>
<circle cx="709" cy="587" r="3.5" fill="#52514e"/>
<text x="721.0" y="592.0" font-size="15.5" fill="#0b0b0b" font-weight="700" text-anchor="start">Contrast is predictable, allocation is not</text>
<text x="721.0" y="613.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start">log loss 0.49 vs 0.65, yet no learned rule beat restarting</text>
<circle cx="709" cy="639" r="3.5" fill="#52514e"/>
<text x="721.0" y="644.0" font-size="15.5" fill="#0b0b0b" font-weight="700" text-anchor="start">Fresh-root RLOO works</text>
<text x="721.0" y="665.0" font-size="14.5" fill="#52514e" font-weight="400" text-anchor="start">58.2% → 64.6% success on 134 unseen tasks</text>
