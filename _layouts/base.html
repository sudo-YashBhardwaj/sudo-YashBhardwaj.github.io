{% include base_path %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include seo.html %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet"
  >
  <link href="{{ base_path }}/assets/css/site.css" rel="stylesheet" type="text/css">
  <script>
    // Apply the saved theme (or the system one) before first paint, so there is no flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
</head>
<body>
  {% if page.url == "/" %}{% assign nav = "" %}{% else %}{% assign nav = base_path | append: "/" %}{% endif %}
  <div class="page-shell">
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ nav }}#about">About</a>
        <a href="{{ nav }}#publications">Publications</a>
        <a href="{{ nav }}#projects">Projects</a>
        <a href="{{ nav }}#experience">Experience</a>
        <a href="{{ nav }}#awards">Awards</a>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>

    <main id="top">
{{ content }}
    </main>

    <footer class="site-footer" aria-label="Location and time zone">
      <span class="footer-globe" aria-hidden="true">🌐</span>
      <span>Paris, France</span>
      <span class="footer-separator" aria-hidden="true">&middot;</span>
      <span>Central European Time (CET, UTC+1 / UTC+2)</span>
    </footer>
  </div>
  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
