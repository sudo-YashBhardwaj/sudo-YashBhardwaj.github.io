# Site settings. Jekyll does not reload this file while serving: restart `jekyll serve` after editing it.

title            : "Yash Bhardwaj"
title_separator  : "·"
description      : "Yash Bhardwaj: MSc student in AI at École Polytechnique, former research intern in the Willow team at Inria Paris. Reinforcement learning, robot learning, representation learning, diffusion and multimodal LLMs. Papers at KDD 2025 (oral) and an ICCV 2025 workshop."
url              : https://sudo-yashbhardwaj.github.io
baseurl          : ""
repository       : "sudo-YashBhardwaj/sudo-YashBhardwaj.github.io"
locale           : "en-US"

# Read by _layouts/base.html, _pages/home.html and _includes/seo.html.
author:
  name           : "Yash Bhardwaj"
  email          : "yash.bhardwaj@polytechnique.edu"
  cv             : "/files/Yash_Bhardwaj_VIS.pdf"   # the CV link everywhere; keep this path stable
  googlescholar  : "https://scholar.google.com/citations?hl=en&user=JrVHBGIAAAAJ"
  orcid          : "https://orcid.org/0009-0000-8179-7151"
  github         : "sudo-YashBhardwaj"
  linkedin       : "yash-bhardwaj-tech/"
  # Structured data (JSON-LD) on the homepage, for search engines
  job_title      : "MSc student in AI"
  affiliations   : ["École Polytechnique"]
  alumni_of      : ["Inria Paris", "Georgia Institute of Technology", "Birla Institute of Technology and Science, Pilani"]
  knows_about    : ["Reinforcement learning", "Robot learning", "Vision-language-action models", "Representation learning", "World models", "Diffusion models", "Multimodal LLMs"]

# Social-preview image for shared links (in /images/)
og_image         : "profile-400.jpg"
og_image_alt     : "Portrait of Yash Bhardwaj"

# Content
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  # _layouts/base.html is the page shell; _layouts/entry.html is a paper or project write-up
  - scope: { path: "", type: pages }
    values: { layout: base }
  - scope: { path: "", type: publications }
    values: { layout: entry }
  - scope: { path: "", type: portfolio }
    values: { layout: entry }

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
keep_files:
  - .git

# Build
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
highlighter: rouge
timezone: Etc/UTC
permalink: /:categories/:title/

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
